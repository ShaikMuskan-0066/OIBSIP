<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TempConvert - Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">TempConvert</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="converter.html" class="active">Converter</a>
            <a href="about.html">About</a>
        </div>
    </nav>


    <!-- Converter Section -->
    <main class="converter-page">

        <div class="converter-container">

            <p class="small-title">TEMPERATURE CONVERTER</p>

            <h1>Convert Temperature</h1>

            <p class="converter-description">
                Enter a temperature and select its unit.
                We will calculate the equivalent values.
            </p>


            <form id="converterForm">

                <!-- Temperature Input -->
                <div class="form-group">

                    <label for="temperature">
                        Enter Temperature
                    </label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Example: 25"
                        step="any"
                    >

                </div>


                <!-- Unit -->
                <div class="form-group">

                    <label for="unit">
                        Select Unit
                    </label>

                    <select id="unit">

                        <option value="Celsius">
                            Celsius (°C)
                        </option>

                        <option value="Fahrenheit">
                            Fahrenheit (°F)
                        </option>

                        <option value="Kelvin">
                            Kelvin (K)
                        </option>

                    </select>

                </div>


                <!-- Error -->
                <p id="errorMessage" class="error-message"></p>


                <!-- Button -->
                <button type="submit" class="convert-button">
                    Convert Temperature →
                </button>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 TempConvert | Temperature Converter</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
